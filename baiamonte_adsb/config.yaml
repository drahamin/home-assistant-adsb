name: "Baiamonte ADS-B"
version: 2.5.8
slug: "baiamonte_adsb"
description: "Tenuta Baiamonte airspace watch and multi-portal ADS-B feeder"
url: "https://github.com/drahamin/home-assistant-adsb"
arch:
  - "aarch64"
  - "amd64"
image: "ghcr.io/drahamin/home-assistant-adsb"
startup: "application"
boot: "auto"
init: false
usb: true
uart: true
udev: true
hassio_api: true
homeassistant_api: true
ingress: true
ingress_port: 8099
webui: "http://[HOST]:[PORT:8099]/tv"
panel_icon: "mdi:airplane-marker"
panel_title: "ADS-B"
panel_admin: true
icon: "icon.png"
ports:
  8099/tcp: 8998
  30001/tcp: null
  30002/tcp: null
  30003/tcp: null
  30004/tcp: null
  30005/tcp: null
  8080/tcp: null
  8754/tcp: null
  30053/tcp: null
  8000/tcp: null
  5002/tcp: null
ports_description:
  8099/tcp: "TV display host port 8998 (internal ingress port remains 8099)"
  30001/tcp: "TCP raw input"
  30002/tcp: "TCP raw output"
  30003/tcp: "TCP BaseStation output"
  30004/tcp: "TCP Beast input"
  30005/tcp: "TCP Beast output"
  8080/tcp: "Optional direct access to the receiver map"
  8754/tcp: "Optional direct access to FlightRadar24 feeder status"
  30053/tcp: "Optional direct access to Plane Finder feeder status"
  8000/tcp: "Optional direct VHF airband audio stream (dashboard playback uses ingress)"
  5002/tcp: "Optional local ADSBHub aggregated SBS feed (inbound only)"
options:
  SERVICE_ENABLE_DUMP1090: true
  SERVICE_ENABLE_PIAWARE: true
  SERVICE_ENABLE_FR24FEED: true
  SERVICE_ENABLE_HTTP: true
  RECEIVER_DEVICE_INDEX: "0"
  RECEIVER_DEVICE_SERIAL: ""
  RECEIVER_GAIN: "auto"
  RECEIVER_PPM: 0
  RECEIVER_BIAS_TEE: false
  AIRBAND_ENABLED: false
  VHF_DEVICE: 1
  VHF_DEVICE_SERIAL: ""
  VHF_USB_RECOVERY: true
  VHF_USB_RESET_ATTEMPTS: 2
  VHF_USB_RESET_ON_START: false
  VHF_PPM: 0
  AIRBAND_GAIN: 28
  AIRBAND_SQUELCH: -28
  AIRBAND_FREQUENCIES: "118.700,119.250,129.725,127.675"
  AIRBAND_LABELS: "Catania Tower,Catania Approach,Catania Ground,Catania ATIS"
  AIRBAND_MOUNT: "baiamonte-airband.mp3"
  AIRBAND_SOURCE_PASSWORD: ""
  AIRNAV_VHF_ENABLED: false
  AIRNAV_VHF_SERVER: ""
  AIRNAV_VHF_PORT: 8000
  AIRNAV_VHF_USERNAME: "source"
  AIRNAV_VHF_PASSWORD: ""
  AIRNAV_VHF_MOUNT: ""
  GPS_USE_USB: true
  GPS_DEVICE: "auto"
