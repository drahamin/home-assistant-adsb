  OPEN_METEO: true
  AVIATION_WEATHER: true
  MAP_STYLE: "standard"
  TV_MAP_TARGET_SIZE: 100
  DASHBOARD_THEME: "auto"
  HOME_AIRPORT: "LICC"
  FLIGHTAWARE_ENRICHMENT: false
  FLIGHTAWARE_AEROAPI_KEY: ""
  SERVICE_ENABLE_ADSBHUB: false
  ADSBHUB_CKEY: ""
  ADSBHUB_PUBLIC_IP_MODE: "auto"
  ADSBHUB_PUBLIC_HOST: "auto"
  ADSBHUB_DYNAMIC_IP_UPDATE: true
  ADSBHUB_SOURCE_HOST: "127.0.0.1"
