  ADSBHUB_OUTBOUND_HOST: "data.adsbhub.org"
  ADSBHUB_OUTBOUND_PORT: 5001
  ADSBHUB_INBOUND_ENABLED: true
  ADSBHUB_OUTBOUND_ONLY: false
