<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1719">
  <title>Baiamonte ADS-B · TV Map</title>
  <link rel="stylesheet" href="display.css?v=211">
  <link rel="stylesheet" href="map-theme.css?v=150">
  <link rel="stylesheet" href="weather-theme.css?v=140">
  <link rel="stylesheet" href="interaction-theme.css?v=140">
</head>
<body>
  <main id="tv-shell">
    <section id="map" class="map" aria-label="Live Baiamonte ADS-B aircraft map">
      <div id="empty">Scanning the sky above Mount Etna</div>
    </section>
    <aside id="fleet" aria-label="Live aircraft list">
      <header class="fleet-head">
        <img src="brand-icon.png" alt="">
        <div><span>TENUTA BAIAMONTE</span><h1>Live aircraft</h1></div>
        <b id="fleet-count">0</b>
      </header>
      <div id="flight-list"></div>
      <footer><i id="feed-light"></i><span id="feed-status">Connecting to the estate receiver</span></footer>
    </aside>
  </main>
  <script src="map.js?v=150"></script>
  <script src="display.js?v=150"></script>
</body>
</html>
